name: Backend CI

# Runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Build, checkstyle and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers starts a real MySQL in Docker, which GitHub runners provide.
      - name: Build and test
        run: mvn -B verify
