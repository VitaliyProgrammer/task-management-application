name: Java CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQLDB_PASSWORD }}
          MYSQL_DATABASE: task_management_application
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -p${{ secrets.MYSQLDB_PASSWORD }} --silent; do
            sleep 3
          done

      - name: Build with Maven
        run: mvn clean verify
        env:
          DB_PASSWORD: ${{ secrets.MYSQLDB_PASSWORD }}
          JWT_SECRET: test_jwt_secret
