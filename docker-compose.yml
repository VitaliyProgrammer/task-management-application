services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped

    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQLDB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD}
    ports:
      - "${MYSQLDB_LOCAL_PORT}:${MYSQLDB_DOCKER_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQLDB_ROOT_PASSWORD}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitaliyprogrammer/task-management-application:1.0.1
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy

    env_file: .env

    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
      - "${DEBUG_PORT}:${DEBUG_PORT}"
    environment:
        SPRING_APPLICATION_JSON: >-
          {
            "spring.datasource.url": "jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC",
            "spring.datasource.username": "root",
            "spring.datasource.password": "${MYSQLDB_ROOT_PASSWORD}",
            "dropbox.access-token": "${DROPBOX_ACCESS_TOKEN}",
            "server.port": "8080",
            "spring.jpa.hibernate.ddl-auto": "validate",
            "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQL8Dialect"
          }
        JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${DEBUG_PORT}"
volumes:
  mysql_data:
