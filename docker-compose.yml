# Local production-like run: the same image and the same "prod" profile as the deployed app,
# with a local MySQL instead of TiDB Cloud. All values come from .env (see .env.template).
services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped

    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQLDB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD}
    ports:
      - "${MYSQLDB_LOCAL_PORT}:${MYSQLDB_DOCKER_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQLDB_ROOT_PASSWORD}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitaliyprogrammer/task-management-application:1.0.1
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy

    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: ${SPRING_DOCKER_PORT}
      DB_URL: jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQLDB_ROOT_PASSWORD}
      FRONTEND_URL: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:${SPRING_LOCAL_PORT}/oauth/google-calendar/callback
      # Locally your own test data should survive: no daily wipe
      DEMO_RESET_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${DEBUG_PORT}"
    volumes:
      # Google OAuth client JSON, mounted where the prod profile expects it
      - ./src/main/resources/google:/etc/secrets:ro
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
      - "${DEBUG_PORT}:${DEBUG_PORT}"

volumes:
  mysql_data:
