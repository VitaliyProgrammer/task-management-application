# Render Blueprint: the backend service described as code.
# Render → New → Blueprint → select this repository. Values marked "sync: false" are
# secrets: Render asks for them once in the dashboard, they never live in git.
# Step-by-step guide: docs/DEPLOYMENT.md

services:
  - type: web
    name: alijenta-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    # Deploy only after CI is green on main
    autoDeployTrigger: checksPass
    # Must not depend on Dropbox or the database: a failing check makes Render restart the app
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # TiDB Cloud Starter
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Dropbox: long-lived refresh token
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false

      # Google Calendar (the OAuth client JSON is a Secret File: credentials.json)
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Security: random values generated by Render on the first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: SECURITY_ENCRYPTION_SECRET
        generateValue: true
      - key: SECURITY_ENCRYPTION_SALT
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # Render free instances block outbound SMTP ports (25, 465, 587)
      - key: EMAIL_ENABLED
        value: "false"

      # The deployed frontend, for CORS and the Google OAuth redirect back
      - key: FRONTEND_URL
        sync: false
