spring.application.name=task-management-application
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/task_management_application
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=secret
spring.datasource.password=secret

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.mvc.log-request-details=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.messages.basename=messages
spring.messages.encoding=UTF-8

dropbox.access-token=secret

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

google.calendar.credentials-path=classpath:google/credentials.json
google.calendar.redirect-uri=http://localhost:8080/oauth/google-calendar/callback

email.enabled=true
email.host=smtp.gmail.com
email.port=587
email.authentication=true
email.starttls=true

security.encryption.secret=secret
security.encryption.salt=secret

telegram.enabled=true
telegram.bot-token=secret

jwt.secret=secret
jwt.expiration=secret
