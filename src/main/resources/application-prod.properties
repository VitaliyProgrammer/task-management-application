# Production profile (SPRING_PROFILES_ACTIVE=prod).
#
# This file is committed, so it holds NO secrets: every secret comes from an environment
# variable set in the hosting dashboard (see docs/DEPLOYMENT.md). The git-ignored
# application.properties is only for local development and is never part of the image.

spring.application.name=task-management-application
# Render (and most PaaS) pass the port to listen on in $PORT
server.port=${PORT:8080}
# Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers
server.forward-headers-strategy=framework

# ===== Database (TiDB Cloud Starter, MySQL-compatible) =====
# Full JDBC URL from the TiDB "Connect" dialog, with TLS, for example:
# jdbc:mysql://<host>:4000/alijenta?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Free instances are small: a few connections are plenty and keep the quota low
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
# "demo" loads the demo workspace on a fresh database
spring.liquibase.contexts=demo

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.messages.basename=messages
spring.messages.encoding=UTF-8

logging.level.root=INFO

# ===== Health checks =====
# /actuator/health           -> database + Dropbox, read by the uptime monitor
# /actuator/health/liveness  -> "the JVM is alive", used by Render; it must not depend on
#                               Dropbox, otherwise a Dropbox outage would restart the app
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===== Dropbox (attachments) =====
# Refresh token + app key + secret never expire. A short-lived DROPBOX_ACCESS_TOKEN is
# accepted only as a fallback for local docker compose runs.
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.app-key=${DROPBOX_APP_KEY:}
dropbox.app-secret=${DROPBOX_APP_SECRET:}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}
# A public demo: keep uploads small so the free 2 GB Dropbox space lasts
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Google Calendar =====
# OAuth client JSON uploaded as a Render "Secret File"
google.calendar.credentials-path=${GOOGLE_CREDENTIALS_PATH:file:/etc/secrets/credentials.json}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI}

# ===== Email / Telegram =====
email.enabled=${EMAIL_ENABLED:true}
email.host=${EMAIL_HOST:smtp.gmail.com}
email.port=${EMAIL_PORT:587}
email.authentication=true
email.starttls=true

telegram.enabled=${TELEGRAM_ENABLED:true}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# ===== Security =====
jwt.secret=${JWT_SECRET}
# 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}
security.encryption.secret=${SECURITY_ENCRYPTION_SECRET}
security.encryption.salt=${SECURITY_ENCRYPTION_SALT}

# ===== Frontend =====
# Where Google OAuth redirects back to, and which origin may call the API (CORS)
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL}

# ===== Demo =====
# Every day at 03:00 UTC all visitor changes are wiped and the demo workspace is reloaded
app.demo.reset.enabled=${DEMO_RESET_ENABLED:true}
app.demo.reset.cron=${DEMO_RESET_CRON:0 0 3 * * *}
