databaseChangeLog:
  - changeSet:
      id: create-attachment-table
      author: vitaliy
      changes:
        - createTable:
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: drop_box_field_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: upload_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_attachments_task_id
            baseTableName: attachments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            onDelete: CASCADE
