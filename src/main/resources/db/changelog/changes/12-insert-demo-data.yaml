databaseChangeLog:
  - changeSet:
      id: insert-demo-data
      author: vitaliy
      context: demo
      dbms: mysql
      # The SQL moved to db/demo/demo-data.sql so the daily demo reset can reuse it.
      # The data is the same, only the checksum changed, so databases that already ran
      # this changeset accept the new version.
      validCheckSum: ANY
      comment: >
        Demo workspace for visitors of the live site.
        Demo login: demo@alijenta.dev / Alijenta2026 (role ADMIN).
        Skipped when the demo user already exists or when the "demo" context is excluded.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE email = 'demo@alijenta.dev'
      changes:
        - sqlFile:
            path: db/demo/demo-data.sql
            encoding: UTF-8
            splitStatements: true
            stripComments: true
