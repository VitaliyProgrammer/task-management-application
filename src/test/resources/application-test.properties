spring.datasource.url=jdbc:tc:mysql:8.0.32:///task_management_application
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.test.database.replace=NONE

# Demo data is loaded in the "demo" Liquibase context only
spring.liquibase.contexts=test

# Dummy values so the application context starts without the local application.properties
# (it is git-ignored and does not exist in CI). These are NOT real secrets.
jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac-sha256
jwt.expiration=3600000
security.encryption.secret=test-only-encryption-secret
security.encryption.salt=5c0744940b5c369b
dropbox.access-token=test-only-dropbox-token
google.calendar.credentials-path=classpath:google/credentials.json
google.calendar.redirect-uri=http://localhost:8080/oauth/google-calendar/callback
telegram.enabled=false
telegram.bot-token=test-only-telegram-token
email.enabled=false
